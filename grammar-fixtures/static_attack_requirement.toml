[fixture]
concept = "static_attack_requirement"
rule = "static_source_attacks_each_combat_if_able"

[[example]]
text = "This creature attacks each combat if able."
reason = "Static source-object attack requirement for a single source permanent type."

[[example]]
text = "This artifact creature attacks each combat if able."
reason = "Same static source-object attack requirement with a compound source permanent type."

[[counterexample]]
