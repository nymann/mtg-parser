[fixture]
concept = "physical_action"
rule = "physical_action"

[[example]]
text = "If this permanent is on the battlefield, flip it onto the battlefield from a height of at least one foot."
reason = "Source-on-battlefield condition with flip action, one as number_word, and foot as physical_height_unit."

[[example]]
text = "If it is on the battlefield, flip it onto the battlefield from a height of at least two feet."
reason = "Source-object variant with plural physical_height_unit."

[[example]]
text = "If it turns over completely at least once during the flip, destroy all nontoken permanents it touches."
reason = "Physical flip-result condition destroying the nontoken permanents touched during the flip."

[[example]]
text = "Then destroy Chaos Orb."
reason = "Physical action sequence follow-up destroying the source object."

[[counterexample]]
text = "If you do, add {G}."
reason = "If-you-do mana follow-up, not a physical dexterity action."

[[counterexample]]
text = "If the player does, untap it."
reason = "If-the-player-does untap follow-up, not a physical dexterity action."

[[counterexample]]
text = "When you do, you gain 3 life."
reason = "Reflexive trigger template, not a source-on-battlefield physical action."

[[counterexample]]
text = "Destroy target nontoken permanent."
reason = "Ordinary target destroy effect, not a physical dexterity action."

[[counterexample]]
text = "Transform this permanent."
reason = "Transform instruction, not a physical dexterity action."

[[counterexample]]
text = "If you do, destroy target permanent."
reason = "If-you-do target destroy follow-up, not a physical dexterity action."

[[counterexample]]
text = "If this permanent is on the battlefield, flip it onto the battlefield from a height of at least one foot. trailing"
reason = "Exact-consumption guard."
