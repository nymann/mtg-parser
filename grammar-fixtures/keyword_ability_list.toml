[fixture]
concept = "keyword_ability_list"
rule = "keyword_ability_list"

[[example]]
text = "flying, trample"
reason = "Comma-separated list of two evergreen keyword abilities."

[[example]]
text = "first strike, vigilance, reach"
reason = "Comma-separated list supports multiword keyword names and three-or-more arity."

[[example]]
