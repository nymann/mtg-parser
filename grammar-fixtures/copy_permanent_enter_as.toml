[fixture]
concept = "copy_permanent_enter_as"
rule = "static_you_may_have_source_enter_as_copy"

[[example]]
text = "You may have CARDNAME enter as a copy of any land on the battlefield, except it doesn't copy that land's color and it has \"When this land enters, draw a card.\""

[[example]]
text = "You may have CARDNAME enter as a copy of any planeswalker on the battlefield, except it doesn't copy that planeswalker's color and it has \"When this planeswalker enters, draw a card.\""

[[example]]
text = "You may have CARDNAME enter as a copy of any enchantment on the battlefield, except it doesn't copy that enchantment's color and it has \"When this enchantment enters, draw a card.\""

[[example]]
text = "You may have CARDNAME enter as a copy of any creature on the battlefield, except it doesn't copy that creature's color and it has \"When this creature enters, draw a card.\""

[[example]]
text = "You may have CARDNAME enter as a copy of any artifact on the battlefield, except it doesn't copy that artifact's color and it has \"When this artifact enters, draw a card.\""

[[example]]
text = "You may have CARDNAME enter as a copy of any creature on the battlefield, except it doesn't copy that creature's color and it has this ability."

[[counterexample]]
text = "Copy target instant spell, except that the copy is red."
reason = "Spell-copy effect, not permanent enter-as-copy replacement wording."

[[counterexample]]
text = "Copy target creature, except it doesn't copy that creature's color and it has this ability."
reason = "Target permanent copy wording, not you-may enter-as-copy replacement wording."

[[counterexample]]
text = "Enchanted creature has \"When this creature dies, draw a card.\""
reason = "Aura-granted triggered ability, not a copy exception on an entering permanent."

[[counterexample]]
text = "You may choose new targets for the copy."
reason = "Target-retargeting permission for an existing copy, not creation of an entering permanent copy."

[[counterexample]]
rule = "copy_exception_with_quoted_triggered_ability"
text = ", except it doesn't copy that creature's color and it has this ability"
reason = "The quoted-triggered-ability exception axis requires a quoted triggered ability."

[[counterexample]]
text = "You may have CARDNAME enter as a copy of any creature on the battlefield, except it doesn't copy that creature's color and it has \"When this creature enters, draw a card.\" trailing"
reason = "Exact-consumption guard."
