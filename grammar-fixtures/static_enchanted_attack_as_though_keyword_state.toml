[fixture]
concept = "static_enchanted_attack_as_though_keyword_state"
rule = "static_enchanted_can_attack_as_though_it_didnt_have"

[[example]]
text = "Enchanted creature can attack as though it didn't have defender."
reason = "Static attack permission evaluated as though the enchanted creature did not have defender."

[[example]]
rule = "static_enchanted_can_attack_as_though_it_had"
