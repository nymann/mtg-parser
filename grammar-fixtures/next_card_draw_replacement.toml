[fixture]
concept = "next_card_draw_replacement"
rule = "next_card_draw_replacement"

[[example]]
text = "The next time you would draw a card this turn, instead look at the top X cards of your library, put all but one of them on the bottom of your library in a random order, then draw a card."
reason = "Next-card-draw-this-turn replacement with variable count through the existing draw_count axis."

