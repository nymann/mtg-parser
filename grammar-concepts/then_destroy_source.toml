[boundary]
excludes = [
    "Unspent-mana transfer instructions owned by then_that_player_loses_unspent_mana_and_you_add_mana_lost_this_way.",
    "Imperative destroy effects without a then sequence marker, owned by destroy or more specific destroy concepts.",
    "Destroy effects for target objects rather than the spell or ability source object.",
    "Physical-action conditional text that destroys nontoken permanents touched during a flip.",
]
includes = [
    "Then-sequenced destroy instructions where the destroyed object is the source object.",
    "Then destroy instructions using CARDNAME, this source object kind, or that source as the source object.",
    "Destroy keyword-action terminology from Comprehensive Rules 701.8.",
]

[concept]
