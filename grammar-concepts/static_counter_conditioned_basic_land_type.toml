[[counterexample]]
reason = "Activated or resolving temporary type-change, not a static counter-conditioned continuous effect."
text = "Target land becomes an Island until CARDNAME leaves the battlefield."

[[counterexample]]
reason = "Counter placement effect, not static type-setting."
text = "Put a flood counter on target non-Island land."

[[example]]
