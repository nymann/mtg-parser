values = ["enchanted_permanent"]

[[axis]]
name = "add_granted_ability"
values = ["keyword"]

[[axis]]
name = "add_attachment_restriction"
values = ["cant_be_enchanted_by_other_auras"]

[boundary]
excludes = [
    "Enchanted-object power/toughness modifications.",
    "Enchanted-object power/toughness modifications with optional keyword grants.",
    "Enchanted-object keyword-removal effects.",
    "Enchanted-object grants of quoted triggered abilities.",
    "Attachment restrictions without a keyword grant.",
    "Keyword grants with unrelated restrictions.",
    "Keyword-removal effects with attachment restrictions.",
]
includes = [
    "Enchanted creature has flying.",
    "Enchanted artifact has indestructible.",
    "Enchanted land has shroud.",
    "Enchanted creature has shroud and can't be enchanted by other Auras.",
    "Enchanted permanent has hexproof and can't be enchanted by other Auras.",
]

[concept]
name = "static_enchanted_keyword_grant"
pest_rules = ["static_enchanted_has_keyword"]
rules_queries = [
    "lex: enchanted permanent has keyword ability",
    "lex: enchanted creature has flying",
    "lex: enchanted permanent can't be enchanted by other Auras",
]
rules_terms = [
    "static",
    "continuous",
    "enchanted",
    "keyword ability",
    "Aura",
]

