[[counterexample]]
reason = "Tap-all-controlled-permanents instruction without unspent-mana loss."
text = "tap all lands target player controls."

[[counterexample]]
reason = "Direct life-loss instruction, owned by player_loses_life."
text = "Its owner loses 3 life."

[[example]]
text = "Tap all lands target player controls and that player loses all unspent mana."

[[example]]
