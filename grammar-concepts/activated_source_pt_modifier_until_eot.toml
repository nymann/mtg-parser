[[axis]]
name = "ability_context"
values = ["activated_effect"]

[[axis]]
name = "recipient"
values = ["source_object"]

[[axis]]
name = "modification"
values = ["pt_modifier"]

[[axis]]
name = "duration"
values = ["until_end_of_turn"]

[boundary]
excludes = [
    "Source keyword grants until end of turn.",
    "Enchanted-object P/T modifications until end of turn.",
    "Target-object P/T modifications until end of turn.",
    "Activated-ability history conditions and delayed sacrifice effects.",
]
includes = [
    "Activated ability effects where the source object gets a P/T modifier until end of turn.",
    "Source-object wording using 'this' or CARDNAME.",
    "Fixed signed power/toughness modifiers with until-end-of-turn duration.",
]

[concept]
name = "activated_source_pt_modifier_until_eot"
pest_rules = ["activated_source_gets_until_eot"]
rules_queries = [
    "lex: this gets +1/+1 until end of turn",
    "lex: source gets +2/+0 until end of turn",
]
rules_terms = [
    "activated ability",
    "continuous effect",
    "power",
    "toughness",
    "modifier",
    "until end of turn",
]

[[counterexample]]
reason = "Source keyword grant, not a source P/T modifier."
text = "This gains flying until end of turn."

[[counterexample]]
reason = "Enchanted-object recipient, not source-object recipient."
text = "Enchanted creature gets +1/+1 until end of turn."

[[counterexample]]
reason = "Target-object recipient, not source-object recipient."
text = "Target creature gets +1/+1 until end of turn."

[[counterexample]]
reason = "Activated-ability history condition with delayed sacrifice, not a P/T modifier effect."
text = "If this ability has been activated three or more times this turn, sacrifice this at the beginning of the next end step."

[[example]]
text = "This gets +1/+1 until end of turn."

[[example]]
text = "CARDNAME gets +2/+0 until end of turn."

[grammar_query]
candidate_rules = [
    "activated_source_gets_until_eot",
    "activated_source_gains_keyword_until_eot",
    "activated_enchanted_gets_until_eot",
    "if_this_ability_activated_at_least_times_this_turn_sacrifice_source_at_next_end_step",
]
selected_rule = "activated_source_gets_until_eot"

[maturity]
blockers = []
pest_grammar = "grammar_fixture_green"
