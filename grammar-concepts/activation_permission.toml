[boundary]
excludes = [
    "Other activation timing windows that are sibling standalone rules but are not currently part of activation_permission.",
    "Activation frequency limits.",
    "Mana ability activation restrictions with source-scope and spending-limit clauses.",
    "Instructions that cause a player to activate an ability rather than permission text for this ability.",
]
includes = [
    "Standalone activation permission sentences currently accepted by the activation_permission wrapper.",
    "Permissions limiting this ability to the source object's owner.",
    "Permissions limiting activation to during your upkeep.",
]

[concept]
name = "activation_permission"
pest_rules = ["activation_permission"]
