[[axis]]
name = "actor"
values = ["that_permanents_controller"]

[[axis]]
name = "modality"
values = ["may"]

[[axis]]
name = "keyword_action"
values = ["attach"]

[[axis]]
name = "object"
values = ["this_aura"]

[[axis]]
name = "object_kind"
values = ["aura"]

[[axis]]
name = "destination"
values = ["article_permanent_type"]

[[axis]]
