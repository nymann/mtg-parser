[boundary]
excludes = [
    "Standalone regeneration prohibition statements without the this-turn death replacement clause.",
    "Standalone death-to-exile replacement effects without the conditional permanent-type regeneration restriction.",
    "Immediate exile instructions such as Exile target creature.",
    "Other replacement effects for destruction or damage removal.",
]
includes = [
    "Conditional statements beginning If it's a permanent type.",
    "This-turn can't-be-regenerated restriction on it.",
    "This-turn would-die replacement that exiles it instead.",
]

[concept]
name = "conditional_regeneration_restriction_and_death_exile_replacement"
pest_rules = ["if_its_permanent_cant_be_regenerated_and_would_die_exile_instead_this_turn"]
rules_queries = [
    "lex: if it's a creature it can't be regenerated this turn if it would die this turn exile it instead",
    "lex: can't be regenerated this turn would die this turn exile it instead",
]
rules_terms = [
    "regenerate",
    "die",
    "exile",
    "replacement effect",
]

[[counterexample]]
reason = "Standalone regeneration prohibition, owned by regeneration_prohibition."
