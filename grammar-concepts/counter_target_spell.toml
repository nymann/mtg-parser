[[axis]]
evidence = ["x"]
name = "amount"

[[axis]]
evidence = ["counter"]
name = "event"

[[axis]]
evidence = ["unless"]
name = "polarity"

[[axis]]
evidence = ["target"]
name = "recipient"

[[axis]]
name = "target_qualifier"
values = ["white", "blue", "black", "red", "green"]

[boundary]
excludes = [
    "Nearby corpus clauses that do not match the selected PEST rule.",
    "Parser, unparser, lowering, generated card tests, and corpus pass status.",
]
includes = [
    "Corpus clauses matching the selected PEST rule counter_target_spell.",
    "Color-qualified target spell countering through the existing counter_target_spell concept.",
    "Rules-grounded wording discovered from qmd and Oracle corpus clustering.",
]

[concept]
name = "counter_target_spell"
pest_rules = ["counter_target_spell", "counter_target_colored_spell"]
rules_files = ["mtg-rules/700-additional-rules/701-keyword-actions/701-6-counter.md"]
rules_queries = ["lex: counter target spell"]
rules_terms = [
    "counter",
    "target",
    "spell",
]

[[counterexample]]
reason = "Baseline unrelated effect."
text = "Destroy target creature."

[[counterexample]]
reason = "Copy effect with color-setting exception, not countering a target spell."
text = "Copy target instant spell, except that the copy is red."

[[counterexample]]
reason = "Color-qualified target permanent removal is a destroy concept, not spell countering."
text = "Destroy target red permanent."

[[counterexample]]
reason = "Casting-cost target-count wording, not a counter target spell effect."
text = "This spell costs {1} more to cast for each target beyond the first."

[[example]]
card = "Counterspell"
text = "Counter target spell."

[[example]]
card = "Power Sink"
text = "Counter target spell unless its controller pays {X}."

[[example]]
card = "Spell Blast"
text = "Counter target spell with mana value X."

[[example]]
card = "Blue Elemental Blast"
text = "Counter target red spell."

[[example]]
card = "Red Elemental Blast"
text = "Counter target blue spell."

[[example]]
text = "Counter target white spell."

[[example]]
card = "Deathgrip"
text = "{B}{B}: Counter target green spell."

[[example]]
card = "Lifeforce"
text = "{G}{G}: Counter target black spell."

[[example]]
card = "Blue Elemental Blast"
text = "• Counter target red spell."

[grammar_query]
candidate_rules = [
    "counter_target_colored_spell_action",
    "counter_target_spell",
    "counter_target_colored_spell",
    "this_spell_costs_mana_more_to_cast_for_each_target_beyond_the_first",
    "copy_target_spell_except_copy_is_color",
    "target_spell_or_permanent_becomes_color",
    "change_text_of_target_spell_or_permanent_replacing_basic_land_type",
    "put_named_counter_on_target_non_basic_land",
    "target_basic_lands_count",
    "regenerate_target_creature",
]
selected_rule = "counter_target_spell"

[maturity]
blockers = []
pest_grammar = "grammar_fixture_green"
