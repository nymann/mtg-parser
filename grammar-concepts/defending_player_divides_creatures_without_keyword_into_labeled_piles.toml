[boundary]
excludes = [
    "Pile division by non-defending players.",
    "Pile division of creatures with a keyword rather than without a keyword.",
    "Pile division of a single labeled pile.",
    "Pile division using unquoted label phrases instead of quoted label piles.",
]
includes = ["Each defending player divides all creatures without a named keyword ability they control into two quoted labeled piles."]

[concept]
name = "defending_player_divides_creatures_without_keyword_into_labeled_piles"
pest_rules = ["defending_player_divides_creatures_without_keyword_into_labeled_piles"]
rules_queries = [
    "lex: defending player divides creatures without keyword into labeled piles",
    "lex: keyword abilities flying first strike shadow",
]
rules_terms = [
    "defending player",
    "keyword ability",
    "creatures",
    "pile",
    "label",
]

[[counterexample]]
reason = "Actor boundary: this concept is limited to each defending player."
text = 'Each attacking player divides all creatures without flying they control into a "left" pile and a "right" pile.'

