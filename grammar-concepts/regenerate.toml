    "Regeneration prohibition effects using can't be regenerated wording.",
    "Replacement effects that mention an object can't be regenerated and exile it instead if it would die.",
    "Other imperative actions that share target creature wording, such as destroy or remove from combat.",
]
includes = [
    "Keyword-action regenerate effects for target creature sentence surfaces.",
    "Activated effects that regenerate the source object.",
    "Activated effects that regenerate an enchanted object.",
]

[concept]
name = "regenerate"
pest_rules = [
    "regenerate_target_creature",
    "regenerate_source",
]
