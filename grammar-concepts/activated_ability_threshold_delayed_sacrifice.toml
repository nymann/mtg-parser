[[axis]]
name = "condition"
values = ["this_ability_has_been_activated_at_least_n_times_this_turn"]

[[axis]]
name = "threshold"
values = ["number_word"]

[[axis]]
name = "effect"
values = ["sacrifice_source"]

[[axis]]
name = "timing"
values = ["beginning_of_the_next_end_step"]

[boundary]
excludes = [
    "If-you-do follow-up effects owned by if_you_do_effect.",
    "Activated-ability activation restrictions introduced by 'Activate only if'.",
    "Activated-ability history conditions with effects other than delayed source sacrifice.",
]
includes = [
    "Conditional delayed source-sacrifice effects whose condition is this ability having been activated at least a number-word threshold this turn.",
    "Threshold wording using 'N or more times this turn'.",
    "Delayed timing at the beginning of the next end step.",
]

[concept]
name = "activated_ability_threshold_delayed_sacrifice"
pest_rules = ["if_this_ability_activated_at_least_times_this_turn_sacrifice_source_at_next_end_step"]
rules_queries = [
    "lex: this ability has been activated three or more times this turn",
    "lex: sacrifice this at the beginning of the next end step",
]
rules_terms = [
    "activated ability",
    "activate",
    "sacrifice",
    "beginning of the next end step",
]

[[counterexample]]
reason = "If-you-do follow-up, not an activated-ability history condition."
text = "If you do, sacrifice this at the beginning of the next end step."

[[counterexample]]
reason = "Activated-ability history condition with a draw-card effect, not delayed source sacrifice."
text = "If this ability has been activated three or more times this turn, draw a card."

[[counterexample]]
reason = "Activation restriction, not a conditional delayed sacrifice effect."
text = "Activate only if this ability has been activated three or more times this turn."

[[example]]
text = "If this ability has been activated three or more times this turn, sacrifice this at the beginning of the next end step."

[grammar_query]
candidate_rules = [
    "if_this_ability_activated_at_least_times_this_turn_sacrifice_source_at_next_end_step",
    "if_you_do_effect",
    "if_you_do_effect_body",
    "beginning_of_the_next_end_step",
    "source_object",
]
selected_rule = "if_this_ability_activated_at_least_times_this_turn_sacrifice_source_at_next_end_step"

[maturity]
blockers = []
pest_grammar = "grammar_fixture_green"
