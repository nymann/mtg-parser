[boundary]
excludes = [
    "Source-object enters-the-battlefield replacement effects.",
    "Enchanted-object blocking restrictions with an exception.",
    "Target-object temporary blocking restrictions.",
    "Source-object blocking prohibitions where the source is the blocker.",
    "Global or player untap-step restrictions not scoped to the source or enchanted object.",
]
includes = [
    "This creature can't be blocked by Walls.",
    "This creature can't be blocked by Dragons.",
    "This creature can't block creatures with power 2 or greater.",
    "This creature doesn't untap during your untap step.",
    "Enchanted creature doesn't untap during its controller's untap step.",
]

