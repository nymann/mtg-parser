[[axis]]
name = "amount"
values = ["damage_prevention_amount"]

[[axis]]
name = "damage_kind"
values = [
    "combat",
    "unspecified",
]

[[axis]]
name = "original_recipient"
values = [
    "you",
    "target_permanent",
    "source_object",
]

[[axis]]
name = "destination"
values = ["its_owner"]

[[axis]]
name = "duration"
values = ["this_turn"]

[boundary]
excludes = [
    "Named-source damage instructions owned by damage_event.",
    "Source-choice next-damage wrappers whose result prevents that damage.",
    "Direct prevention shields that prevent damage instead of redirecting where it is dealt.",
]
includes = [
    "Replacement effects for the next amount of damage that would be dealt this turn.",
    "Redirection effects that keep the underlying damage event axes outside damage_event.",
    "Damage redirection to the original recipient object's owner.",
]

[concept]
name = "damage_redirection_effect"
pest_rules = ["next_damage_redirection_effect"]
rules_queries = [
    "lex: damage would be dealt dealt to its owner instead",
    "lex: replacement effect damage dealt to its owner instead",
]
rules_terms = [
    "replacement effect",
    "damage",
    "recipient",
    "owner",
]

[[counterexample]]
reason = "Named-source damage instruction, owned by damage_event."
text = "Lightning Bolt deals 3 damage to any target."

[[counterexample]]
reason = "Source-choice next-damage prevention wrapper, not this redirection shape."
text = "The next time a source of your choice would deal damage to target creature this turn, prevent that damage."

[[counterexample]]
reason = "Direct prevention shield, not redirection."
text = "Prevent the next 1 damage that would be dealt to any target this turn."

[[example]]
text = "The next 1 damage that would be dealt to target creature this turn is dealt to its owner instead."

[[example]]
text = "The next 2 combat damage that would be dealt to you this turn is dealt to its owner instead."

[[example]]
text = "The next 1 damage that would be dealt to CARDNAME this turn is dealt to its owner instead."

[maturity]
blockers = []
pest_grammar = "grammar_fixture_green"
