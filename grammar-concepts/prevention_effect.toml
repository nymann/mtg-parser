[[axis]]
name = "amount"
values = [
    "all",
    "the next N",
    "N of",
]

[[axis]]
name = "event"
values = [
    "damage that would be dealt",
    "combat damage that would be dealt",
    "that damage",
]

[[axis]]
name = "recipient"
values = [
    "any target",
    "that permanent or player",
]

[[axis]]
name = "duration"
values = [
    "this turn",
    "sentence-local no explicit duration",
]

[boundary]
excludes = [
    "Damage redirection where damage is dealt somewhere else instead.",
    "Life gain based on damage after damage is dealt or prevented.",
    "Replacement effects that do not prevent a damage event.",
]
includes = [
    "Effects that use prevent wording to stop damage events.",
    "Amount-limited prevention such as the next N damage.",
    "All-damage prevention scoped by damage kind, recipient, source, or duration.",
]

[concept]
name = "prevention_effect"
pest_rules = ["damage_prevention_effect"]
rules_queries = [
    "lex: prevention effect prevent damage",
    "lex: damage would be dealt prevent",
]
rules_terms = [
    "prevention effect",
    "damage",
    "event",
]

[[counterexample]]
reason = "Imperative destruction, not damage prevention."
text = "Destroy target creature."

[[counterexample]]
reason = "Temporal replacement trigger wrapper belongs to the next-damage-event concept before the nested prevention result is isolated."
text = "The next time a red source of your choice would deal damage to you this turn, prevent that damage."

[[counterexample]]
reason = "Variable definition shape is not yet accepted by the direct grammar fixture and remains a separate maturity blocker."
text = "Prevent X of that damage, where X is the number of +1/+1 counters on Rock Hydra."

[[example]]
text = "Prevent the next 1 damage that would be dealt to any target this turn."

[[example]]
text = "Prevent all combat damage that would be dealt this turn."

[[example]]
text = "Prevent all damage that would be dealt to that permanent or player this turn."

[maturity]
blockers = []
pest_grammar = "grammar_fixture_green"
