[[axis]]
name = "effect_kind"
values = ["continuous_or_copy_effect"]

[[axis]]
name = "protected_object"
values = ["this_aura"]

[[axis]]
name = "prohibited_result"
values = ["remove_aura"]

[boundary]
excludes = [
    "Static enters-tapped replacement effects, owned by static_enters_tapped.",
    "Source-object static replacement effects where the source enters tapped.",
    "Effects that remove an Aura rather than preserving it.",
    "Aura or enchantment text that does not refer to preserving this Aura.",
]
includes = ["Effect-continuity text stating that this effect doesn't remove this Aura."]

[concept]
name = "static_effect_preserves_aura"
