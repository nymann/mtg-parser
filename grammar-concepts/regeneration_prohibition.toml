[[axis]]
name = "subject"
values = [
    "it",
    "they",
]

[[axis]]
name = "polarity"
values = ["cant"]

[[axis]]
name = "restricted_action"
values = ["regenerate"]

[[axis]]
name = "surface"
values = ["sentence_statement"]

[[axis]]
name = "duration"
values = ["implicit_current_effect_only"]

[boundary]
excludes = [
    "Keyword-action regenerate instructions such as Regenerate target creature.",
    "Activated regenerate effects such as Regenerate this creature.",
    "Conditional replacement effects with explicit this-turn duration and exile-instead consequences.",
]
includes = ["Sentence statements saying an anaphoric object or objects can't be regenerated by the current effect."]

[concept]
name = "regeneration_prohibition"
pest_rules = ["it_cant_be_regenerated"]
rules_queries = [
    "lex: can't be regenerated",
    "lex: it can't be regenerated",
    "lex: they can't be regenerated",
]
rules_terms = [
    "regenerate",
    "regenerated",
    "can't",
]

[[counterexample]]
reason = "Keyword-action regenerate instruction, not a prohibition."
text = "Regenerate target creature."

[[counterexample]]
reason = "Activated regenerate effect, not a prohibition."
text = "Regenerate this creature."

[[counterexample]]
reason = "Conditional this-turn prohibition plus replacement effect, outside the implicit current-effect boundary."
text = "If it's a creature, it can't be regenerated this turn, and if it would die this turn, exile it instead."

[[example]]
text = "It can't be regenerated."

[[example]]
text = "They can't be regenerated."

[grammar_query]
candidate_rules = [
    "it_cant_be_regenerated",
    "regenerate_target_creature",
    "regenerate_source",
    "if_its_permanent_cant_be_regenerated_and_would_die_exile_instead_this_turn",
]
selected_rule = "it_cant_be_regenerated"

[maturity]
blockers = []
pest_grammar = "grammar_fixture_green"
