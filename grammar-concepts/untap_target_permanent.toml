[boundary]
excludes = [
    "Targeted tap or tap-or-untap choice effects, owned by tap_target_permanent_choice.",
    "Untap instructions for the referenced permanent using 'the', owned by untap_referenced_permanent.",
    "Source-object untap instructions such as untap CARDNAME or untap this creature, owned by untap_source or related source-object rules.",
    "Instructions targeting nonpermanent objects or players.",
]
includes = ["Activated-effect instructions that untap target artifact, battle, creature, enchantment, land, or planeswalker."]

[concept]
name = "untap_target_permanent"
