[boundary]
excludes = [
    "Direct life-loss instructions owned by player_loses_life.",
    "Life payment costs owned by life-payment concepts, not mana payment.",
    "Unless-payment clauses that introduce a failure consequence rather than a direct optional payment permission.",
]
includes = [
    "Direct optional instructions where you may pay a mana cost.",
    "Direct optional instructions where that player may pay any amount of mana.",
]

[concept]
name = "player_may_pay_mana"
pest_rules = [
    "player_may_pay_mana",
    "pay_mana_player",
    "you_pay_mana_player",
    "that_player_pay_mana_player",
    "pay_mana_amount",
    "any_amount_of_mana",
]
