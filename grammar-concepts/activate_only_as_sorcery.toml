[[counterexample]]
reason = "Your-turn timing permission with an activation frequency is outside sorcery timing and does not preserve activation_frequency=none."
text = "Activate only during your turn and only once each turn."

[[counterexample]]
reason = "Upkeep timing permission is a sibling timing-window concept, not sorcery timing."
text = "Activate only during your upkeep."

[[counterexample]]
reason = "Combat timing permission is a sibling timing-window concept, not sorcery timing."
