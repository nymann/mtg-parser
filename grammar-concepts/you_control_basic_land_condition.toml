[[axis]]
name = "actor"
values = ["you"]

[[axis]]
name = "relationship"
values = ["control"]

[[axis]]
name = "object"
values = ["basic_land_type"]

[[axis]]
name = "quantity"
values = [
    "article",
    "no_plural",
]

[[axis]]
name = "polarity"
values = [
    "affirmative",
    "negative",
]

[[axis]]
name = "sentence_form"
values = ["condition_clause"]

[boundary]
excludes = [
    "Ownership text is not control-checking text.",
    "Basic-land noun phrases such as basic lands you control are not condition clauses.",
    "Control conditions for actors other than you are outside this concept.",
]
includes = [
    "you control a Plains",
    "you control an Island",
    "you control a Forest",
    "you control no Islands",
]

[concept]
name = "you_control_basic_land_condition"
pest_rules = [
    "you_control_basic_land",
    "you_control_no_basic_lands",
]
rules_queries = ["lex: you control a basic land type condition"]
rules_terms = [
    "control",
    "basic land type",
    "condition",
]

[[counterexample]]
reason = "Ownership relationship, not control."
text = "You own target card in the graveyard."

[[counterexample]]
reason = "Noun phrase/count operand, not a condition clause."
text = "basic lands you control"

[[counterexample]]
reason = "Different actor."
text = "defending player controls a Plains"

[[example]]
text = "you control a Plains"

[[example]]
text = "you control an Island"

[[example]]
text = "you control a Forest"

[[example]]
text = "you control no Islands"

[grammar_query]
