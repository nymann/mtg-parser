[boundary]
excludes = [
    "Source-object keyword grants until end of turn.",
    "Target-object P/T modifications until end of turn.",
    "Target-object combined keyword grants and P/T modifications with variable definitions.",
    "Target permanent type-changing effects with source-linked durations.",
    "Enchanted-object keyword grants until end of turn.",
]
includes = [
    "Target permanent keyword ability grants until end of turn.",
    "Target creature keyword grants with combat-role selectors.",
    "Target creature keyword grants with controlled-creature power/toughness selectors.",
]

[concept]
name = "target_permanent_keyword_ability_gain_until_eot"
pest_rules = ["target_permanent_gains_keyword_until_eot"]
rules_queries = [
    "lex: target creature gains flying until end of turn",
    "lex: target attacking creature gains first strike until end of turn",
    "lex: target creature you control with toughness less than source power gains flying until end of turn",
]
rules_terms = [
    "activated ability",
    "continuous effect",
    "keyword ability",
    "target permanent",
    "until end of turn",
]

[[counterexample]]
reason = "Source-object recipient, covered by activated_source_keyword_ability_gain_until_eot."
text = "This gains flying until end of turn."

[[counterexample]]
reason = "Target-object P/T modifier, not a keyword ability grant."
text = "Target creature gets +1/+1 until end of turn."

[[counterexample]]
reason = "Combined keyword grant and P/T modifier, not keyword-only grant."
text = "Target creature gains flying and gets +1/+1 until end of turn, where X is the number of cards in your hand."

[[counterexample]]
reason = "Type-changing effect with source-linked duration, not an until-end-of-turn keyword ability grant."
text = "Target artifact becomes an Island until CARDNAME leaves the battlefield."

[[counterexample]]
reason = "Enchanted-object recipient, not target-permanent recipient."
text = "Enchanted creature gains flying until end of turn."

[[example]]
text = "Target creature gains flying until end of turn."

[[example]]
text = "Target attacking creature gains first strike until end of turn."

[[example]]
text = "Target creature you control with toughness less than CARDNAME's power gains flying until end of turn."

