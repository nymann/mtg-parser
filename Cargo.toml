[workspace]
resolver = "2"
members = [
    "crates/mtg-grammar",
    "crates/mtg-semantic",
    "crates/mtg-scryfall",
    "crates/mtg-corpus",
    "xtask",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/nymann/mtg-parser"

[workspace.dependencies]
pest = "2.7"
pest_derive = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
proptest = "1.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
dirs = "5"
ratatui = "0.29"
crossterm = "0.28"

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 0
